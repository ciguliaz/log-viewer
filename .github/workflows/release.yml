name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  build-and-release:
    name: Build & Release Wails App
    runs-on: windows-latest
    permissions:
      contents: write # Important for creating the GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Patch version in wails.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $json = Get-Content wails.json | ConvertFrom-Json
          $json.info.productVersion = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content wails.json

      - name: Build Application
        run: wails build -ldflags "-X main.AppVersion=${{ github.ref_name }}"

      - name: Package binary
        shell: pwsh
        run: Compress-Archive -Path build/bin/log-viewer.exe -DestinationPath build/bin/log-viewer_windows_amd64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/log-viewer_windows_amd64.zip
          generate_release_notes: true
